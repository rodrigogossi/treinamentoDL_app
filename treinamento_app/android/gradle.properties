org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround para um problema conhecido do AGP 9 com os artefatos nativos
# do TensorFlow Lite usados pelo tflite_flutter: as bibliotecas
# org.tensorflow:tensorflow-lite / tensorflow-lite-api / tensorflow-lite-gpu
# (versão 2.11.0) compartilham o mesmo namespace Android "org.tensorflow.lite"
# no próprio manifesto — algo que só os mantenedores do TensorFlow podem
# corrigir na origem. O AGP 9 passou a validar isso de forma estrita e falha
# a build. Esta flag desativa essa validação estrita (reconhecida como
# solução temporária pelo próprio time do Google/TensorFlow — ver
# https://github.com/tensorflow/tensorflow/issues/109508).
android.uniquePackageNames=false
